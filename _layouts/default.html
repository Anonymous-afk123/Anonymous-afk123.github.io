<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title | default: "我的主页" }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  </head>
  <body>
    <header>
      <div class="header-inner" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; background: #f5f5f5; border-bottom: 1px solid #e0e0e0;">
        <div class="site-title">
          <a href="{{ "/" | relative_url }}" style="font-size: 1.5em; font-weight: bold; text-decoration: none; color: #333;">
            {{ site.title | default: "我的主页" }}
          </a>
        </div>
        <div class="header-links" style="display: flex; gap: 20px; align-items: center;">
          <a href="{{ "/" | relative_url }}" style="text-decoration: none; color: #0366d6;">首页</a>
          <a href="https://github.com/{{ site.github.owner_name | default: "Anonymous-afk123" }}" style="text-decoration: none; color: #0366d6;">GitHub</a>
          <span style="color: #888; font-size: 0.9em;">⭐ 0</span>
        </div>
      </div>
    </header>

    <div class="wrapper" style="max-width: 1200px; margin: 0 auto; padding: 20px;">
      {{ content }}
    </div>

    <footer>
      <div style="text-align: center; padding: 20px; color: #888; font-size: 0.9em; border-top: 1px solid #e0e0e0; margin-top: 30px;">
        &copy; {{ site.time | date: "%Y" }} {{ site.author | default: "Anonymous-afk123" }}
      </div>
    </footer>
  </body>
</html>
