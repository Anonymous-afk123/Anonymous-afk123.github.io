<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title | default: "我的主页" }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body style="
    margin: 0 !important;
    padding: 0 !important;
    padding-top: 80px !important;  /* 给固定页眉留出空间，防止内容被遮住 */
    background: #f0edf5 !important;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
  ">

    <!-- 页眉：使用 fixed 固定在最顶部 -->
    <header style="
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 16px 40px !important;
      background: #1a1a2e !important;
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      box-sizing: border-box !important;
      flex-wrap: wrap !important;
      gap: 10px !important;
      z-index: 9999 !important;
    ">
      <div class="site-title">
        <a href="{{ '/' | relative_url }}" style="font-size: 1.6em !important; font-weight: 700 !important; text-decoration: none !important; color: #ffffff !important;">
          {{ site.title | default: "我的主页" }}
        </a>
      </div>
      <div style="display: flex !important; gap: 24px !important; align-items: center !important;">
        <a href="{{ '/' | relative_url }}" style="text-decoration: none !important; color: #c8b8ff !important; font-weight: 500 !important;">首页</a>
        <a href="{{ '/lun-wen-bi-ji/' | relative_url }}" style="text-decoration: none !important; color: #c8b8ff !important; font-weight: 500 !important;">论文笔记</a>
        <a href="https://github.com/{{ site.github.owner_name | default: 'Anonymous-afk123' }}" style="text-decoration: none !important; color: #c8b8ff !important; font-weight: 500 !important;">GitHub</a>
      </div>
    </header>

    <!-- 内容区域：由于 header 已 fixed，body 的 padding-top 已经预留了空间，这里不需要额外 margin-top -->
    <div style="max-width: 1200px !important; margin: 20px auto !important; padding: 0 30px !important;">
      {{ content }}
    </div>

    <footer style="text-align: center !important; padding: 20px 0 !important; color: #888 !important; font-size: 0.9em !important; border-top: 1px solid #ddd !important; margin-top: 30px !important; max-width: 1200px !important; margin-left: auto !important; margin-right: auto !important;">
      &copy; {{ site.time | date: "%Y" }} {{ site.author | default: "Anonymous-afk123" }}
    </footer>
  </body>
</html>
